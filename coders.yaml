version: "1"
mode: native
services:
  web:
    dockerfile: Dockerfile
    context: .
    port: 3000
    expose: public
    timeout: 3600
    env:
      DATABASE_URL: ${db.url}
      SITE_PROVIDER: coders
      SITE_URL: https://tradingstocksysyem.coders.kr/
      LIVE_TRADING_ENABLED: "false"
      LIVE_TRADING_EGRESS_READY: "false"
      LIVE_MARKET_ENABLED: "false"
      TRADING_ENVIRONMENT: member_certification
  db:
    type: postgres
    size: 1Gi
